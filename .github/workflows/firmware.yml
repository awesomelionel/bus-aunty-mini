name: firmware

# The point of supporting three boards from one tree is that none can rot
# unnoticed, which only holds if all three are built on every change.
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The toolchain and the board packages are by far the slowest part of
      # this job, and they only change when platformio.ini does.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Host unit tests
        working-directory: firmware
        run: pio test -e native

      # No -e: this builds every env in default_envs, i.e. the three boards.
      - name: Build all boards
        working-directory: firmware
        run: pio run

      # The release workflow ships these, so build them on every change too:
      # a broken merge step should fail a PR, not a release.
      - name: Build merged images
        working-directory: firmware
        run: |
          for board in sticks3 feather_s3_revtft tdisplay_s3; do
            pio run -e "$board" -t mergebin
            ls -l .pio/build/"$board"/bus-aunty-"$board"-*.bin
          done

      # Native PNG tool. Not in default_envs, so the board build above skips it.
      - name: Build host renderer
        working-directory: firmware
        run: pio run -e host_render
