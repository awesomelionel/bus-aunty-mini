[platformio]
default_envs = sticks3, feather_s3_revtft, tdisplay_s3

# Shared by every ESP32 board. Board-specific libraries stay out of here: the
# StickS3's panel is driven by a different (and symbol-clashing) GFX fork from
# the other two, so each board env appends its own lib_deps.
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.2

# Feature flags (change 1 to 0 to disable):
# -DBUS_AUNTY_SHOW_VISIT_MARKER=0  ; Hide "2nd" marker for loop second-visit arrivals
build_flags =
    -DBUS_AUNTY_SHOW_VISIT_MARKER=1

[env:sticks3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<hal/feather_s3_revtft/> -<hal/tdisplay_s3/>
lib_deps =
    ${esp32_base.lib_deps}
    m5stack/M5Unified@^0.2.21

# Deliberately sets no memory/flash/USB flags: the board manifest already
# carries qio_qspi, BOARD_HAS_PSRAM and ARDUINO_USB_CDC_ON_BOOT=1, and forcing
# ARDUINO_USB_MODE would fight the TinyUF2 bootloader.
[env:feather_s3_revtft]
extends = esp32_base
board = adafruit_feather_esp32s3_reversetft
# The manifest's default splits 4MB into two 1408K OTA slots. This firmware
# currently fits (~1.2MB) but does not use OTA. The no-OTA layout spends the
# second slot on the app instead, giving 2816K headroom, and keeps the uf2
# factory partition so double-tap-reset flashing still works.
# The CSV is in this directory: older espressif32 packages (what CI
# resolves from `platform = espressif32`) do not ship it.
board_build.partitions = tinyuf2-partitions-4MB-noota.csv
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_FEATHER_S3_REVTFT
build_src_filter = +<*> -<hal/sticks3/> -<hal/tdisplay_s3/>
lib_deps =
    ${esp32_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.28
    adafruit/Adafruit MAX1704X@^1.0.3

# The board manifest already carries the 16MB flash, the octal PSRAM
# (qio_opi), default_16MB.csv and both USB flags, so only PSRAM has to be
# declared to the Arduino core here. 16MB leaves the app 6.5MB, which this
# firmware is nowhere near, so no custom partition table is needed.
[env:tdisplay_s3]
extends = esp32_base
board = lilygo-t-display-s3
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_TDISPLAY_S3
    -DBOARD_HAS_PSRAM
build_src_filter = +<*> -<hal/sticks3/> -<hal/feather_s3_revtft/>
lib_deps =
    ${esp32_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.28

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson@^7.2.2
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/>
    -<net/>
    -<storage/>
    -<ui/>
