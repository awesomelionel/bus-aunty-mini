[platformio]
default_envs = sticks3, feather_s3_revtft

# Shared by every ESP32 board. Board-specific libraries stay out of here: the
# two panels are driven by different (and symbol-clashing) GFX forks, so each
# board env appends its own lib_deps.
[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.2
    tzapu/WiFiManager@^2.0.17

[env:sticks3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<hal/feather_s3_revtft/>
lib_deps =
    ${esp32_base.lib_deps}
    m5stack/M5Unified@^0.2.21

# Deliberately sets no memory/flash/USB flags: the board manifest already
# carries qio_qspi, BOARD_HAS_PSRAM and ARDUINO_USB_CDC_ON_BOOT=1, and forcing
# ARDUINO_USB_MODE would fight the TinyUF2 bootloader.
[env:feather_s3_revtft]
extends = esp32_base
board = adafruit_feather_esp32s3_reversetft
# The manifest's default splits 4MB into two 1408K OTA slots, and this
# firmware does not fit in one of those (nor does it do OTA). The no-OTA
# layout spends the second slot on the app instead, giving 2816K, and keeps
# the uf2 factory partition so double-tap-reset flashing still works.
board_build.partitions = tinyuf2-partitions-4MB-noota.csv
build_flags =
    -DBOARD_FEATHER_S3_REVTFT
build_src_filter = +<*> -<hal/sticks3/>
lib_deps =
    ${esp32_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.28
    adafruit/Adafruit MAX1704X@^1.0.3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson@^7.2.2
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/>
    -<net/>
    -<storage/>
    -<ui/>